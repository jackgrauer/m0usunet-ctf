name: Deploy m0usunet to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Skeleton-era workflow: the runtime is pure JS now (no v86, no
# Alpine disk image). The build job exists only to ship site/ to
# Pages. The full Alpine-build pipeline is preserved in git history;
# the build/*.sh scripts will be removed once the JS port is feature
# complete and we're sure we don't want to roll back.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
