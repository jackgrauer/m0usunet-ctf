name: Deploy m0usunet to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Pure-JS runtime now (no v86, no Alpine disk image). Stage the
# content files into site/ so they're reachable at the deployed
# origin, then upload site/ to Pages.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage runtime content into site/
        run: |
          set -euo pipefail
          mkdir -p site/build
          cp -r kit-content site/kit-content
          cp build/ic-memo.txt site/build/ic-memo.txt
          ls -lh site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
