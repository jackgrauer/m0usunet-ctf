name: Deploy m0usunet to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch v86 artifacts
        run: |
          set -euo pipefail
          mkdir -p site/v86
          REL="https://github.com/copy/v86/releases/download/latest"
          for f in libv86.js v86.wasm; do
            echo "fetching $f"
            curl -fsSL "$REL/$f" -o "site/v86/$f"
          done
          RAW="https://raw.githubusercontent.com/copy/v86/master/bios"
          for f in seabios.bin vgabios.bin; do
            echo "fetching $f"
            curl -fsSL "$RAW/$f" -o "site/v86/$f"
          done
          ls -lh site/v86/

      - name: Load NBD kernel module on host
        run: sudo modprobe nbd max_part=16

      - name: Build Alpine + kit disks
        run: |
          set -euo pipefail
          docker run --rm --privileged \
            -v "$PWD:/work" -w /work \
            i386/alpine:3.18 sh -c '
              set -eu
              apk add --no-cache git bash e2fsprogs util-linux coreutils qemu-img
              ./build/build-alpine.sh
              ./build/build-kit.sh
            '
          ls -lh build/out/

      - name: Stage disk images into site/
        run: |
          cp build/out/alpine.img site/
          cp build/out/kit.img    site/
          ls -lh site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
