<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <title>m0usunet // crazy.ants</title>
  <link rel="icon" type="image/svg+xml" href="mouse.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/xterm@5.3.0/css/xterm.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div id="screen-wrap">
      <div id="terminal"></div>
    </div>
  </main>

  <!-- v86 wants a screen_container even though we render everything
       through xterm. Keep it offscreen but instantiated. -->
  <div id="v86-headless" aria-hidden="true">
    <div></div>
    <canvas></canvas>
  </div>

  <div id="splash">
    <div class="splash-inner">
      <div class="splash-line1">m0usunet v0.9.7  &bull;  Field Operations</div>
      <div class="splash-gap"></div>
      <div class="splash-line2">OPERATION: PARMESAN ROSE</div>
      <div class="splash-rule">═══════════════════════════════════════</div>
      <div class="splash-gap"></div>
      <div id="splash-status"><span class="spinner"></span> initialising terminal&hellip;</div>
    </div>
  </div>

  <script src="https://unpkg.com/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://unpkg.com/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
  <script src="v86/libv86.js"></script>
  <script src="nicks.js"></script>
  <script src="boot.js"></script>
</body>
</html>
