<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ops Log — m0usunet</title>
  <link rel="icon" type="image/svg+xml" href="mouse.svg">
  <link rel="stylesheet" href="style.css">
  <style>
    .board-wrap { padding: 1rem; max-width: 720px; margin: 0 auto; }
    h1 { color: var(--green); margin: 0 0 1rem 0; font-size: 1.1rem; letter-spacing: 0.05em; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { padding: 0.4rem 0.6rem; text-align: left; border-bottom: 1px solid var(--green-dim); }
    th { color: var(--green); font-weight: 600; }
    tbody tr:nth-child(odd) { background: #0c0c0c; }
    .empty { color: var(--green-dim); padding: 1rem; text-align: center; }
    footer { color: var(--green-dim); font-size: 0.75rem; margin-top: 1.5rem; }
  </style>
</head>
<body>
  <header>
    <img class="mouse" src="mouse.svg" alt="">
    <span class="title">m0usunet &mdash; OPS LOG</span>
    <a href="index.html" class="board">Back to terminal</a>
  </header>

  <div class="board-wrap">
    <h1>OPERATION: PARMESAN &mdash; intel shipped</h1>
    <table id="board-table">
      <thead>
        <tr>
          <th>#</th>
          <th>operator</th>
          <th>intel shipped</th>
          <th>last submission</th>
        </tr>
      </thead>
      <tbody>
        <tr><td colspan="4" class="empty">No operators on the wire yet.</td></tr>
      </tbody>
    </table>
    <footer>
      Target: <code>crazy.ants</code>. Three stages, three tools, thirty minutes.
    </footer>
  </div>
</body>
</html>
