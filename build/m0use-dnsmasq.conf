# Forward + reverse DNS for the fake crazy.ants network.
# Listens only on localhost; the fake hosts and the player both
# resolve through here (resolv.conf points at 127.0.0.1).

no-resolv
no-poll
no-hosts
listen-address=127.0.0.1
bind-interfaces
port=53
log-queries=no
log-facility=-

# Forward records
address=/gw.crazy.ants/10.4.12.1
address=/mail.crazy.ants/10.4.12.10
address=/www.crazy.ants/10.4.12.20
address=/api.crazy.ants/10.4.12.21
address=/db-01.crazy.ants/10.4.12.30
address=/db-02.crazy.ants/10.4.12.31
address=/redis.crazy.ants/10.4.12.40
address=/vpn.crazy.ants/10.4.12.50
address=/ci.crazy.ants/10.4.12.70
address=/grafana.crazy.ants/10.4.12.80
address=/legacy-build-03.crazy.ants/10.4.12.88
address=/assets.crazy.ants/10.4.12.99

# Reverse records.
# Crucially, 10.4.12.88 resolves to jenkins-old.internal.crazy.ants
# even though its forward DNS is legacy-build-03 — that's the "internal"
# leak the player is meant to spot.
ptr-record=1.12.4.10.in-addr.arpa,gw.crazy.ants
ptr-record=10.12.4.10.in-addr.arpa,mail.crazy.ants
ptr-record=20.12.4.10.in-addr.arpa,www.crazy.ants
ptr-record=21.12.4.10.in-addr.arpa,api.crazy.ants
ptr-record=30.12.4.10.in-addr.arpa,db-01.crazy.ants
ptr-record=31.12.4.10.in-addr.arpa,db-02.crazy.ants
ptr-record=40.12.4.10.in-addr.arpa,redis.crazy.ants
ptr-record=50.12.4.10.in-addr.arpa,vpn.crazy.ants
ptr-record=70.12.4.10.in-addr.arpa,ci.crazy.ants
ptr-record=80.12.4.10.in-addr.arpa,grafana.crazy.ants
ptr-record=88.12.4.10.in-addr.arpa,jenkins-old.internal.crazy.ants
ptr-record=99.12.4.10.in-addr.arpa,assets.crazy.ants
